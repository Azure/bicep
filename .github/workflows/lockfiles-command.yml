name: Update dotnet and npm lockfiles
on:
  workflow_dispatch:

jobs:
  lockfiles:
    # dotnet restore for src/vs-bicep/BicepInVisualStudio.sln doesn't seem to work well on Linux
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Restore dotnet dependencies
        run: |
          echo "Restoring dependencies for Bicep.slnx"
          dotnet restore --force-evaluate
          echo "Restoring dependencies for BicepInVisualStudio.sln"
          dotnet restore src/vs-bicep/BicepInVisualStudio.sln --force-evaluate

      - name: Set up VS Code dependencies
        run: |
          echo "Setting up dependencies for vscode-bicep and related projects"
          node .\scripts\setup-development.mjs
        working-directory: src/vscode-bicep

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: Update lockfiles
          commit_user_name: ${{ github.actor }}
          commit_user_email: ${{ github.actor }}@users.noreply.github.com
          commit_author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
