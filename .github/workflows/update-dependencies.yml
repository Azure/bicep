name: Update Dependencies
# This action can be run on-demand against a branch.
# It attempts to update dotnet & npm dependencies, and commits and pushes changes if there are any.

on:
  workflow_dispatch:

jobs:
  main:
    name: Update Dependencies
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

      - name: Setup .NET Core
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24

      - name: Install Tools
        run: |
          npm install -g npm-check-updates
          dotnet tool install -g dotnet-outdated-tool

      - name: Update Dependencies
        continue-on-error: true
        run: ./scripts/update_dependencies.sh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: update-dependencies
          delete-branch: true
          title: |
            Update NPM & Dotnet Dependencies
          commit-message: |
            Update NPM & Dotnet Dependencies
          labels: dependencies
          draft: false
