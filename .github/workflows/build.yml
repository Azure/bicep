name: Build

on:
  push:
    branches: [main,ant/orchestrator_demo]
  pull_request:
    branches: [main,ant/orchestrator_demo]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read
  security-events: write

env:
  CI: true
  # don't print dotnet logo
  DOTNET_NOLOGO: true
  # disable telemetry (reduces dotnet tool output in logs)
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-cli:
    name: Build CLI (${{ matrix.rid }})
    runs-on: ubuntu-latest

    strategy:
      # let us get failures from other jobs even if one fails
      fail-fast: false
      # should be the full list of supported RIDs with customizations expressed via the parameters under each item
      matrix:
        rid:
          - win-x64
          - linux-x64
          - linux-musl-x64
          - osx-x64
          - linux-arm64
          - win-arm64
          - osx-arm64

    steps:
      # Moving to immutable SHAs prevents supply chain attacks which silently change
      # mutable versions of GH actions.
      # Dependabot is smart enough to update these when versions change.
      # See: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
      # for more details, though these are "built-in" actions supplied by github it still makes sense to pin
      # them for defense in depth.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
          submodules: true

      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Publish Bicep
        run: dotnet publish --configuration release --self-contained true -r ${{ matrix.rid }} ./src/Bicep.Cli/Bicep.Cli.csproj

      - name: Upload Bicep
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bicep-release-${{ matrix.rid }}
          path: ./src/Bicep.Cli/bin/release/net10.0/${{ matrix.rid }}/publish/*
          if-no-files-found: error

      - name: Upload Bicep project assets file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bicep-project-assets-${{ matrix.rid }}
          path: ./src/Bicep.Cli/obj/project.assets.json
          if-no-files-found: error

  build-nugets:
    name: Build NuGet Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
          submodules: true

      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Pack
        run: dotnet pack --configuration release

      - name: Upload Packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bicep-nupkg-any
          path: out/*
          if-no-files-found: error

  build-vscode-ext:
    name: "Build: VSCode Extension"
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24

      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Publish Language Server
        run: |
          dotnet publish --configuration release ./src/Bicep.LangServer/Bicep.LangServer.csproj
          cp -R src/Bicep.LangServer/bin/release/net10.0/publish ./src/vscode-bicep/bicepLanguageServer

      - name: Publish MCP Server
        run: |
          dotnet publish --configuration release ./src/Bicep.McpServer/Bicep.McpServer.csproj
          cp -R src/Bicep.McpServer/bin/release/net10.0/publish ./src/vscode-bicep/bicepMcpServer

      - name: Check npm version
        run: npm -v

      - name: npm ci (vscode-bicep-ui)
        run: npm ci
        working-directory: ./src/vscode-bicep-ui

      - name: Build vscode-bicep-ui
        run: npm run build
        working-directory: ./src/vscode-bicep-ui

      - name: npm ci (vscode-bicep)
        run: npm ci
        working-directory: ./src/vscode-bicep

      - name: Generate VSIX notice
        run: |
          mkdir -p ./src/vscode-bicep-notice/inputs
          npm --prefix ./src/vscode-bicep list -a --json > ./src/vscode-bicep-notice/inputs/npm-list.json
          cp ./src/Bicep.LangServer/obj/project.assets.json ./src/vscode-bicep-notice/inputs/langserver.assets.json
          cp ./src/Bicep.McpServer/obj/project.assets.json ./src/vscode-bicep-notice/inputs/mcpserver.assets.json
          dotnet build --configuration Release ./src/vscode-bicep-notice/vscode-bicep-notice.proj

      - name: Create VSIX
        run: npm run package
        working-directory: ./src/vscode-bicep

      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vscode-bicep.vsix
          path: ./src/vscode-bicep/vscode-bicep.vsix
          if-no-files-found: error

  test-vscode-bicep-ui:
    name: "Test: VSCode Bicep UI"
    runs-on: ${{ matrix.os }}
    needs: build-vscode-ext
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24

      - name: Check npm version
        run: npm -v

      - name: npm ci
        run: npm ci
        working-directory: ./src/vscode-bicep-ui

      - name: Run lint
        run: npm run lint
        working-directory: ./src/vscode-bicep-ui

      - name: Run build
        run: npm run build
        working-directory: ./src/vscode-bicep-ui

      - name: Run tests
        run: npm run test
        working-directory: ./src/vscode-bicep-ui

      - name: Install Playwright browsers (visual-designer)
        if: runner.os == 'Linux'
        run: npm run e2e:install
        working-directory: ./src/vscode-bicep-ui/apps/visual-designer

      - name: Run Playwright E2E tests (visual-designer)
        if: runner.os == 'Linux'
        run: npm run e2e
        working-directory: ./src/vscode-bicep-ui/apps/visual-designer
        env:
          CI: "true"

      - name: Upload Playwright report (visual-designer)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-designer-playwright-report
          path: ./src/vscode-bicep-ui/apps/visual-designer/e2e/.report
          if-no-files-found: ignore
          retention-days: 7

  test-vscode-ext:
    name: "Test: VSCode Extension"
    runs-on: ${{ matrix.os }}
    needs: build-vscode-ext
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        # OSX runner performance is slow (https://github.com/actions/runner-images/issues/1336).
        # We can get away with skipping it for PRs, and instead triggering on merges to main.
        skipOsx:
          - ${{ github.event_name == 'pull_request' }}
        exclude:
          - skipOsx: true
            os: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24

      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Publish Language Server
        run: |
          dotnet publish --configuration release ./src/Bicep.LangServer/Bicep.LangServer.csproj
          cp -R src/Bicep.LangServer/bin/release/net10.0/publish ./src/vscode-bicep/bicepLanguageServer

      - name: Publish MCP Server
        run: |
          dotnet publish --configuration release ./src/Bicep.McpServer/Bicep.McpServer.csproj
          cp -R src/Bicep.McpServer/bin/release/net10.0/publish ./src/vscode-bicep/bicepMcpServer

      - name: Check npm version
        run: npm -v

      - name: npm ci (vscode-bicep-ui)
        run: npm ci
        working-directory: ./src/vscode-bicep-ui

      - name: Build vscode-bicep-ui)
        run: npm run build
        working-directory: ./src/vscode-bicep-ui

      - name: npm ci (vscode-bicep)
        run: npm ci
        working-directory: ./src/vscode-bicep

      - name: Run lint
        run: npm run lint
        working-directory: ./src/vscode-bicep

      - name: Run unit tests
        run: npm run test:unit
        working-directory: ./src/vscode-bicep

      - name: Build prod
        run: npm run build:prod
        working-directory: ./src/vscode-bicep

      - name: Build E2E tests
        run: npm run build:e2e
        working-directory: ./src/vscode-bicep

      - name: Run E2E tests
        run: npm run test:e2e
        if: runner.os != 'Linux'
        working-directory: ./src/vscode-bicep

      # In headless Linux CI machines xvfb is required to run VS Code, so need a separate path for Linux.
      - name: Run E2E tests (Linux)
        run: xvfb-run -a npm run test:e2e
        if: runner.os == 'Linux'
        working-directory: ./src/vscode-bicep

      - name: Show extension logs of E2E tests
        run: cat ./bicep-e2e.log
        if: always()
        working-directory: ./src/vscode-bicep

  test-dotnet:
    name: 'Test Dotnet (${{ matrix.os }}) (${{matrix.config.name}})'
    runs-on: ${{ matrix.os }}
    strategy:
      # let us get failures from other jobs even if one fails
      fail-fast: false
      matrix:
        config:
          - name: Core
            filter: FullyQualifiedName~Bicep.Core.IntegrationTests
          - name: LangServer
            filter: FullyQualifiedName~Bicep.LangServer.IntegrationTests
          - name: Others
            filter: FullyQualifiedName!~Bicep.Core.IntegrationTests&FullyQualifiedName!~Bicep.LangServer.IntegrationTests
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        # OSX runner performance is slow (https://github.com/actions/runner-images/issues/1336).
        # We can get away with skipping it for PRs, and instead triggering on merges to main.
        skipOsx:
          - ${{ github.event_name == 'pull_request' }}
        exclude:
          - skipOsx: true
            os: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
          submodules: true

      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Run Tests
        run: dotnet test --configuration release -- --filter '${{ matrix.config.filter }}' --report-trx --results-directory ${{ github.workspace }}/TestResults

      - name: Upload Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: TestResults-${{ matrix.config.name }}-${{ matrix.os }}
          path: ./TestResults/*.trx
          if-no-files-found: error
