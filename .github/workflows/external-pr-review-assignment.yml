name: Assign reviewers for external PRs

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened]

permissions:
  pull-requests: write

jobs:
  assign-reviewers:
    # The 'if' statement below will exclude Dependabot PRs and internal PRs
    if: >
      github.actor != 'dependabot[bot]' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'OWNER'
    runs-on: ubuntu-latest
    # The job below will use the built-in "Request reviewers for a pull request" script to assign reviewers
    steps:
      - name: Assign Bicep team members as reviewers
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers: [
                'shenglol',
                'levimatheri',
                'majastrz',
                'harshpatel17',
                'anthony-c-martin',
                'tsmallig33'
              ]
            })
