name: Assign reviewers for external PRs

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened]

permissions:
  pull-requests: write

jobs:
  assign-reviewers:
    # The 'if' statement below will exclude Dependabot PRs and internal PRs
    if: >
      github.actor != 'dependabot[bot]' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'OWNER'
    runs-on: ubuntu-latest
    # The job below will use the built-in "Request reviewers for a pull request" script to assign reviewers
    steps:
      - name: Assign reviewer from Bicep External Maintainers team
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              team_reviewers: ['azure-deployments-and-bicep-code-reviewers']
            })
